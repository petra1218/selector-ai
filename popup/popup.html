<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <h1 class="popup__title">Selector</h1>
      <p class="popup__description">
        Inject the selector shell into the active tab.
      </p>
      <button id="start-selector" class="popup__button" type="button">
        Start Selector
      </button>
      <p id="status" class="popup__status" aria-live="polite">
        Ready to inject.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
